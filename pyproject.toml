[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exitvalue-mcp"
version = "0.1.0"
description = "MCP server for M&A valuation multiples by industry and deal size (EV/EBITDA, EV/Revenue). Free, no API key."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "ExitValue.ai" }]
keywords = ["mcp", "mcp-server", "model-context-protocol", "valuation", "m&a", "ebitda-multiple", "small-business"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Financial",
]
dependencies = ["mcp>=1.9"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://exitvalue.ai/ai-connector"
Repository = "https://github.com/nickcals/exitvalue-mcp"
Dataset = "https://exitvalue.ai/data/multiples.json"

[project.scripts]
exitvalue-mcp = "exitvalue_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/exitvalue_mcp"]
